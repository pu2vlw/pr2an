<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>PR2AN - Osciloscopio</title>
<style>
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background:#0b0b0d;
    width:100%;
    min-height:100vh;
    font-family:'Segoe UI',Arial,sans-serif;
  }
  .rig{
    width:100%;
    padding:10px;
    background:linear-gradient(180deg,#3a3d42 0%, #22242a 12%, #1b1c20 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.15),
      inset 0 -3px 6px rgba(0,0,0,.5);
    border:1px solid #16171a;
  }
  .screen-frame{
    background:#000;
    border-radius:6px;
    padding:8px;
    border:2px solid #050506;
    box-shadow:inset 0 0 12px rgba(0,0,0,.9);
  }
  .lcd{
    position:relative;
    border-radius:3px;
    overflow:hidden;
    border:1px solid #0c2530;
    background:radial-gradient(120% 140% at 50% 50%, #041722 0%, #010a10 55%, #000305 100%);
  }

  /* ================= OSCILOSCOPIO (100% CSS/SVG, sem JS) ================= */
  .scope{
    position:relative;
    height:190px;
    overflow:hidden;
  }

  .scope-grid{
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(90deg, rgba(90,180,255,.09) 0, rgba(90,180,255,.09) 1px, transparent 1px, transparent 8.333%),
      repeating-linear-gradient(180deg, rgba(90,180,255,.09) 0, rgba(90,180,255,.09) 1px, transparent 1px, transparent 20%);
    pointer-events:none;
  }
  .scope-center{
    position:absolute; left:0; right:0; top:50%; height:1px;
    background:rgba(120,200,255,.25);
  }

  .track{
    position:absolute; left:0; top:0; width:100%; height:100%;
    overflow:hidden;
  }
  .track-inner{
    display:flex;
    width:200%;
    height:100%;
    will-change:transform;
  }
  .track-inner svg{
    width:50%; height:100%; flex:0 0 50%;
    display:block;
  }

  .trackA .track-inner{ animation: scroll-left 6s linear infinite; }
  .trackB .track-inner{ animation: scroll-left 9s linear infinite reverse; }
  .trackC .track-inner{ animation: scroll-left 22s linear infinite; }

  @keyframes scroll-left{
    from{ transform:translateX(0); }
    to{ transform:translateX(-50%); }
  }

  .trackA polyline{
    fill:none;
    stroke:#8fe9ff;
    stroke-width:2.6;
    stroke-linejoin:round;
    stroke-linecap:round;
    filter: drop-shadow(0 0 4px rgba(120,220,255,.9)) drop-shadow(0 0 10px rgba(70,180,255,.55));
    opacity:.95;
  }
  .trackB polyline{
    fill:none;
    stroke:#3f8fd9;
    stroke-width:1.6;
    stroke-linejoin:round;
    stroke-linecap:round;
    filter: drop-shadow(0 0 3px rgba(70,150,230,.5));
    opacity:.55;
  }
  .trackC polyline{
    fill:none;
    stroke:#1e5a95;
    stroke-width:1.2;
    stroke-linejoin:round;
    stroke-linecap:round;
    opacity:.4;
  }

  /* ================= Placa PR2AN / ON AIR ================= */
  .callsign-overlay{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:5;
  }
  .onair-plate{
    font-family:'Arial Narrow','Arial',sans-serif;
    font-size:40px; font-weight:900;
    letter-spacing:10px;
    color:#fff;
    background:linear-gradient(180deg,#e21b2b 0%, #b30f1e 55%, #950a17 100%);
    padding:10px 34px 12px;
    border:4px solid #fff;
    border-radius:6px;
    box-shadow:
      0 0 0 2px rgba(0,0,0,.55),
      0 6px 14px rgba(0,0,0,.6),
      0 0 24px rgba(226,27,43,.85),
      inset 0 2px 3px rgba(255,255,255,.35),
      inset 0 -4px 6px rgba(0,0,0,.35);
    text-shadow:0 2px 2px rgba(0,0,0,.5);
    animation:sign-glow 4.5s infinite ease-in-out;
    white-space:nowrap;
    text-align:center;
  }
  .onair-sub{
    font-size:13px;
    font-weight:700;
    letter-spacing:5px;
    color:#fff;
    margin-top:2px;
    opacity:.92;
  }
  @keyframes sign-glow{
    0%,88%,100%{
      box-shadow:
        0 0 0 2px rgba(0,0,0,.55), 0 6px 14px rgba(0,0,0,.6),
        0 0 24px rgba(226,27,43,.85),
        inset 0 2px 3px rgba(255,255,255,.35), inset 0 -4px 6px rgba(0,0,0,.35);
    }
    90%{
      box-shadow:
        0 0 0 2px rgba(0,0,0,.55), 0 6px 14px rgba(0,0,0,.6),
        0 0 10px rgba(226,27,43,.4),
        inset 0 2px 3px rgba(255,255,255,.2), inset 0 -4px 6px rgba(0,0,0,.35);
    }
    92%{
      box-shadow:
        0 0 0 2px rgba(0,0,0,.55), 0 6px 14px rgba(0,0,0,.6),
        0 0 34px rgba(226,27,43,1),
        inset 0 2px 3px rgba(255,255,255,.4), inset 0 -4px 6px rgba(0,0,0,.35);
    }
  }

  .freq-scale{
    display:flex; justify-content:space-between;
    padding:4px 14px 2px;
    font-family:'Consolas','DejaVu Sans Mono',monospace;
    font-size:10px; color:#3f7f8f; letter-spacing:1px;
  }

  @media (max-width:640px){
    .onair-plate{ font-size:26px; letter-spacing:6px; padding:7px 20px 9px; border-width:3px; }
    .onair-sub{ font-size:10px; letter-spacing:3px; }
  }
  @media (max-width:400px){
    .onair-plate{ font-size:18px; letter-spacing:4px; padding:5px 14px 7px; border-width:2px; }
    .onair-sub{ font-size:8px; letter-spacing:2px; }
  }
</style>
</head>
